<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dizzipline</title>
<style>
:root{--line:rgba(255,255,255,.1);--mu:rgba(255,255,255,.55);--ok:#30d158;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
#app{max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.screen{display:none;padding:28px 20px 130px}
.screen.on{display:block;animation:in .5s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.mu{color:var(--mu)}

/* Login */
#login{position:fixed;inset:0;z-index:50;background:#000;display:none;align-items:center;justify-content:center;padding:24px;overflow:hidden}
#login.on{display:flex}
.orb{position:absolute;border-radius:50%;filter:blur(80px);animation:fl 14s ease-in-out infinite alternate}
.o1{width:340px;height:340px;background:#4a4a55;opacity:.45;top:-90px;left:-90px}
.o2{width:300px;height:300px;background:#1d4fa8;opacity:.3;bottom:-70px;right:-70px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,50px) scale(1.2)}}
.lw{position:relative;width:100%;max-width:360px;text-align:center}
.lw>*{animation:in .9s var(--ease) both}
.logo{width:76px;height:76px;margin-bottom:22px}
.logo circle{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:190;animation:ring 2s .2s var(--ease) both}
.logo path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;animation:ring 1s 1.1s var(--ease) both}
@keyframes ring{from{stroke-dashoffset:190}}
.lw h1{font-size:46px;font-weight:700;letter-spacing:-.035em;background:linear-gradient(#fff,#8e8e93);-webkit-background-clip:text;background-clip:text;color:transparent}
.lw .mu{margin:8px 0 34px;font-size:17px}
.in{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:0 18px;outline:0;margin-bottom:10px;font-size:17px;transition:.2s}
.in:focus{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.1)}
.in::placeholder{color:rgba(255,255,255,.35)}
.btn{width:100%;height:54px;border-radius:27px;border:0;background:#fff;color:#000;font-weight:600;font-size:17px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.lnk{background:none;border:0;color:var(--mu);font-size:15px;padding:12px;cursor:pointer}
#msg{min-height:20px;font-size:14px;color:#ff6961;margin-bottom:8px}

/* Header */
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.top h2{font-size:34px;font-weight:700;letter-spacing:-.03em}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:20px;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin:14px 0 24px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .8s var(--ease)}

/* Karten */
.card{position:relative;min-height:156px;border-radius:30px;overflow:hidden;padding:22px;margin-bottom:14px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;isolation:isolate;transition:transform .25s var(--ease),filter .5s}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(0,0,0,.72),transparent 75%)}
.card:active{transform:scale(.97)}
.card h3{font-size:25px;font-weight:700;letter-spacing:-.025em;max-width:80%}
.card p{font-size:15px;color:rgba(255,255,255,.7);margin-top:4px;max-width:80%}
.card small{position:absolute;top:20px;left:22px;font-size:13px;font-weight:600;color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:5px 11px;border-radius:12px}
.ic{position:absolute;right:20px;bottom:20px;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.4s var(--ease)}
.ic svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lk{filter:grayscale(1) brightness(.42);cursor:not-allowed}
.dn{filter:saturate(.5) brightness(.6)}
.dn .ic{background:var(--ok);border-color:var(--ok)}
.dn .ic path{stroke-dasharray:24;animation:dr .5s .1s both}
@keyframes dr{from{stroke-dashoffset:24}}
.pr{position:absolute;left:0;bottom:0;height:4px;background:#fff;transition:width 1s linear}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.t0{background:radial-gradient(120% 90% at 85% 0,#55555e,transparent 55%),repeating-linear-gradient(115deg,#000 0 14px,#0c0c0e 14px 15px),#000}
.t1{background:radial-gradient(90% 80% at 20% 115%,#ff6a2b,#b3261e 38%,transparent 72%),radial-gradient(60% 50% at 85% 5%,#3d1b44,transparent),#080305}
.t2{background:repeating-radial-gradient(circle at 90% 15%,rgba(10,132,255,.4) 0 1px,transparent 1px 24px),radial-gradient(100% 90% at 90% 15%,#0a3f86,transparent 65%),#02060d}
.t3{background:radial-gradient(80% 70% at 10% 0,rgba(48,209,88,.65),transparent 60%),radial-gradient(70% 70% at 100% 100%,#5e5ce6,transparent 60%),#02050a}

.t4{background:radial-gradient(90% 80% at 80% 0,#ffd60a,#c97a00 40%,transparent 75%),radial-gradient(60% 60% at 0 100%,#7a2f00,transparent),#0a0600}
.ent{animation:in .6s var(--ease) backwards}
.amt{max-height:64px;overflow:hidden;transition:max-height .4s var(--ease),opacity .3s}
.amt.h{max-height:0;opacity:0;pointer-events:none}
.gold .rg,.gold .r2{border-color:#ffd60a}.gold u{background:#ffd60a}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.lw2{height:130px;overflow:hidden;font-size:120px;font-weight:700;letter-spacing:-.05em;line-height:130px;text-align:center;margin-top:-30px}
.lw2 div{animation:lvup 1.2s .7s var(--ease) both}
.lw2 i{display:block;font-style:normal;height:130px}
.lvl{animation-duration:3.8s}
.lvl .bl{margin-top:210px;animation-delay:1.2s;text-align:center;max-width:280px}
.dnn .lw2 div{animation-name:lvdn}
.hold .lw2 div{animation:none}
.dnn .rg,.dnn .r2{border-color:#ff453a}
@keyframes lvup{to{transform:translateY(-130px)}}
@keyframes lvdn{from{transform:translateY(-130px)}}
/* Tab-Leiste */
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 32px));display:flex;padding:6px;border-radius:30px;background:rgba(30,30,32,.7);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--line);z-index:20}
nav button{flex:1;background:none;border:0;padding:9px 0 7px;border-radius:24px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mu);cursor:pointer;transition:.3s}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Plan, Formular, Profil */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.06);margin-bottom:8px;overflow:hidden;transition:height .35s var(--ease),opacity .3s,transform .35s var(--ease),padding .35s var(--ease),margin .35s var(--ease)}
.row.out{height:0!important;opacity:0;transform:translateX(60px);padding-top:0;padding-bottom:0;margin-bottom:0}
.row.new{animation:grow .5s var(--ease)}
@keyframes grow{from{max-height:0;opacity:0;transform:translateY(-12px) scale(.96);padding-top:0;padding-bottom:0;margin-bottom:0}to{max-height:90px;opacity:1;transform:none;padding-top:14px;padding-bottom:14px;margin-bottom:8px}}
.row b{flex:1;font-weight:600}.row span{font-size:13px;color:var(--mu)}
.row button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1);cursor:pointer}
.form{margin-top:22px;padding:18px;border-radius:26px;border:1px solid var(--line)}
.form h3{font-size:19px;margin-bottom:14px}
.seg{display:flex;padding:3px;background:rgba(255,255,255,.08);border-radius:13px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:10px 2px;font-size:14px;border-radius:10px;font-weight:600;color:var(--mu);cursor:pointer;transition:.25s}
.seg button.on{background:rgba(255,255,255,.18);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 16px}
.sw button{width:46px;height:46px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.25s}
.sw button.on{border-color:#fff;transform:scale(1.12)}
.tg{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:16px}
.tg input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.18);position:relative;transition:.3s;cursor:pointer;flex:none}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.3s var(--ease)}
.tg input:checked{background:var(--ok)}.tg input:checked::after{transform:translateX(20px)}
.big{font-size:84px;font-weight:700;letter-spacing:-.05em;line-height:1;margin:6px 0 4px}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:700;background:radial-gradient(circle at 30% 20%,#6a6a74,#18181a);border:1px solid var(--line);margin:8px 0 14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.stats div{padding:16px;border-radius:20px;background:rgba(255,255,255,.06)}
.stats b{display:block;font-size:28px;letter-spacing:-.03em}.stats span{font-size:13px;color:var(--mu)}
.ghost{width:100%;height:50px;border-radius:25px;background:rgba(255,255,255,.08);border:0;font-weight:600;margin-bottom:10px;cursor:pointer}

/* Abschluss-Animation */
.burst{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:bf 2s forwards}
@keyframes bf{0%{opacity:0}12%,78%{opacity:1}100%{opacity:0}}
.burst>*{grid-area:1/1}
.rg{width:120px;height:120px;border-radius:50%;border:2px solid #fff;animation:rg 1.3s var(--ease) both}
.r2{animation-delay:.18s;border-color:var(--ok)}
@keyframes rg{from{transform:scale(.2);opacity:1}to{transform:scale(4);opacity:0}}
.bc{width:70px;height:70px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;animation:dr2 .6s .1s var(--ease) both,fo .5s .7s forwards;margin-top:-170px}
@keyframes dr2{from{stroke-dashoffset:40}}
@keyframes fo{to{opacity:0;transform:scale(.6)}}
.bp{font-size:96px;font-weight:700;letter-spacing:-.05em;animation:pop .9s .55s var(--ease) both;margin-top:30px}
.bl{margin-top:150px;font-size:17px;color:var(--mu);animation:in .6s .85s both}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.6)}}
.burst u{width:7px;height:7px;border-radius:50%;background:#fff;animation:pt 1.1s .1s var(--ease) both}
@keyframes pt{from{transform:translate(0,0)}60%{opacity:1}to{transform:translate(var(--x),var(--y));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="lw">
    <svg class="logo" viewBox="0 0 80 80"><circle cx="40" cy="40" r="30"/><path d="M28 41l8 8 16-18"/></svg>
    <h1>Dizzipline</h1>
    <p class="mu">Jeden Tag ein Stück besser.</p>
    <input class="in" id="em" type="email" placeholder="E-Mail" autocomplete="email">
    <input class="in" id="pw" type="password" placeholder="Passwort" autocomplete="current-password">
    <p id="msg"></p>
    <button class="btn" id="go">Anmelden</button>
    <button class="lnk" id="mode">Neu hier? Konto erstellen</button><br>
    <button class="lnk" id="skip">Überspringen</button>
  </div>
</div>

<div id="app">
  <section class="screen on" id="s-heute">
    <div class="top"><div><p class="mu" id="date"></p><h2>Heute</h2></div><div class="pill" id="ppill"><span id="pp">0</span> Punkte</div></div>
    <p class="mu" id="sub"></p>
    <div class="bar"><i id="bar"></i></div>
    <div id="list"></div>
  </section>

  <section class="screen" id="s-plan">
    <div class="top"><h2>Trainingsplan</h2></div>
    <p class="mu" style="margin-bottom:18px">Die Reihenfolge entscheidet, was gesperrt ist.</p>
    <div id="plist"></div>
    <div class="form">
      <h3>Neuer Schritt</h3>
      <div class="seg" id="seg"><button data-t="w" class="on">Aufgabe</button><button data-t="p">Pause</button><button data-t="e">Essen</button><button data-t="b">Belohnung</button></div>
      <input class="in" id="fn" placeholder="Name, z. B. 30 Crunches">
      <div class="amt" id="amt"><input class="in" id="fa" type="number" min="1" value="30" inputmode="numeric" placeholder="Wiederholungen"></div>
      <div class="sw" id="sw"><button class="t0 on" data-th="0"></button><button class="t1" data-th="1"></button><button class="t2" data-th="2"></button><button class="t3" data-th="3"></button><button class="t4" data-th="4"></button></div>
      <label class="tg">Gesperrt, bis der Schritt davor erledigt ist<input type="checkbox" id="fl" checked></label>
      <button class="btn" id="add">Zum Plan hinzufügen</button>
    </div>
  </section>

  <section class="screen" id="s-profil">
    <div class="av" id="av"></div>
    <h2 id="un" style="font-size:26px;letter-spacing:-.02em"></h2>
    <div class="big" id="bp">0</div>
    <p class="mu">Level · ein Tag, ein Level</p>
    <div class="bar" style="margin:20px 0 6px"><i id="lb"></i></div>
    <p class="mu" id="lv" style="font-size:14px"></p>
    <div class="stats"><div><b id="st1">0</b><span>Disziplin-Punkte</span></div><div><b id="st2">0</b><span>Erledigte Schritte</span></div></div>
    <button class="ghost" id="reset">Tag zurücksetzen</button>
    <button class="ghost" id="out">Abmelden</button>
  </section>
</div>

<nav id="nav">
  <button data-s="heute" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Heute</button>
  <button data-s="plan"><svg viewBox="0 0 24 24"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>Plan</button>
  <button data-s="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
</nav>

<script type="module">
/* ===== FIREBASE =====
   1. Firebase Console > Projekt > Web-App anlegen, Config unten eintragen.
   2. Authentication > Anmeldemethode > E-Mail/Passwort aktivieren.
   3. Firestore Database anlegen und die Regeln aus der Antwort veröffentlichen.
   Solange "DEIN_" in der Config steht, läuft die App lokal ohne Cloud. */
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {
    apiKey: "AIzaSyDyAl0GHXrSs8WK4Ca0jBc_IDM75ZJB46c",
    authDomain: "dizzipline-7cea0.firebaseapp.com",
    projectId: "dizzipline-7cea0",
    storageBucket: "dizzipline-7cea0.firebasestorage.app",
    messagingSenderId: "464321825850",
    appId: "1:464321825850:web:a226b5edf6cf0f8c1eb903"
  };
const FB_ON=!firebaseConfig.apiKey.startsWith('DEIN');
let auth,db,synced=false,cloudT;
if(FB_ON){const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}
const authLogin=async(e,p)=>{if(!FB_ON)return{name:e};const c=await signInWithEmailAndPassword(auth,e,p);return{name:c.user.email,uid:c.user.uid}};
const authRegister=async(e,p)=>{if(!FB_ON)return{name:e};const c=await createUserWithEmailAndPassword(auth,e,p);return{name:c.user.email,uid:c.user.uid}};
const authLogout=async()=>{if(FB_ON)await signOut(auth)};
const ERR={'auth/invalid-credential':'E-Mail oder Passwort stimmt nicht.','auth/invalid-email':'Das ist keine gültige E-Mail.','auth/email-already-in-use':'Diese E-Mail ist schon registriert.','auth/weak-password':'Das Passwort braucht mindestens 6 Zeichen.','auth/too-many-requests':'Zu viele Versuche. Bitte warte kurz.','auth/network-request-failed':'Keine Verbindung. Prüfe dein Internet.'};
/* ==================================== */

const $=s=>document.querySelector(s),K='disziplin-v1',today=new Date().toDateString();
const def=()=>({user:null,pts:0,total:0,day:today,steps:[
  {n:'30 Crunches',t:'w',a:30,th:0,lk:false},
  {n:'Pause',t:'p',a:5,th:2,lk:true},
  {n:'20 Liegestütze',t:'w',a:20,th:1,lk:true},
  {n:'Proteinshake',t:'e',a:0,th:3,lk:true},
  {n:'Eine Folge deiner Serie',t:'b',a:20,th:4,lk:true}]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||def();
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),TK=dk(new Date());
const gap=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
/* je 2 komplett ausgelassene Tage: ein Level weg */
function roll(){
  if(S.day!==today){S.day=today;S.steps.forEach(s=>{s.done=0;s.until=0})}
  S.lvl=S.lvl||1;S.pl=S.pl||0;S.lost=S.lost||0;
  if(S.last){const tot=Math.floor((gap(S.last,TK)-1)/2),dl=tot-S.pl;if(dl>0){const o=S.lvl;S.lvl=Math.max(1,S.lvl-dl);S.lost+=o-S.lvl}S.pl=Math.max(S.pl,tot)}
}
roll();
const save=()=>{
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  if(FB_ON&&synced&&S.user&&S.user.uid){clearTimeout(cloudT);cloudT=setTimeout(()=>{
    const {user,...d}=S;setDoc(doc(db,'users',S.user.uid),JSON.parse(JSON.stringify(d)),{merge:true}).catch(console.error)},800)}
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LBL={w:'Aufgabe',p:'Pause',e:'Essen',b:'Belohnung'};
const pts=s=>s.t=='w'?10+Math.floor(s.a/10):s.t=='b'?s.a:5;
const meta=s=>({w:s.a+' Wdh.',p:s.a+' Min.',e:'+5 Punkte',b:'+'+s.a+' Punkte'})[s.t];
const ctext=(s,i,lk,run)=>lk?'Gesperrt, erst „'+S.steps[i-1].n+'“ erledigen':s.done?(s.t=='b'?'Eingelöst':'Erledigt'):({w:s.a+' Wiederholungen · Tippen zum Abhaken',p:run?fmt(s.until-Date.now())+' verbleibend':s.a+' Minuten · Tippen zum Starten',e:'Tippen, wenn du gegessen hast',b:'+'+s.a+' Bonuspunkte · Tippen zum Einlösen'})[s.t];
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const CHK='<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg>',
LOCK='<svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M9 11V8a3 3 0 016 0v3"/></svg>',
PLAY='<svg viewBox="0 0 24 24"><path d="M9 7l8 5-8 5z"/></svg>',
STAR='<svg viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8z"/></svg>';
const isLocked=(i)=>{const s=S.steps[i];return s.lk&&i>0&&!s.done&&!S.steps[i-1].done};

function render(){
  $('#login').classList.toggle('on',!S.user);
  $('#pp').textContent=S.pts;
  renderHeute();renderPlan();renderProf();
  if(S.lost&&S.user){const l=S.lost;S.lost=0;save();setTimeout(()=>levelFx(S.lvl+l,S.lvl),700)}
}
let sig='';
function renderHeute(){
  const st=S.steps,d=st.filter(s=>s.done).length,L=$('#list');
  $('#date').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  $('#sub').textContent='Level '+S.lvl+' · '+(st.length?(d==st.length?'Alles erledigt. Stark.':d+' von '+st.length+' erledigt'):'Noch kein Plan angelegt');
  $('#bar').style.width=st.length?d/st.length*100+'%':0;
  const k2=JSON.stringify(st.map(s=>[s.n,s.t,s.a,s.th]));
  if(k2!==sig){sig=k2;L.innerHTML=st.map((s,i)=>`<div class="card ent t${s.th}" style="animation-delay:${i*.07}s" data-i="${i}"><small>${LBL[s.t]}</small><h3>${esc(s.n)}</h3><p></p><i class="ic"></i></div>`).join('')||'<p class="mu">Lege im Tab „Plan“ deinen ersten Schritt an.</p>'}
  st.forEach((s,i)=>{
    const c=L.children[i],lk=isLocked(i),run=s.until>Date.now(),k=s.done?'d':lk?'l':run?'r':'o';
    c.classList.toggle('lk',lk);c.classList.toggle('dn',!!s.done);
    c.querySelector('p').textContent=ctext(s,i,lk,run);
    if(c.dataset.k!=k){c.dataset.k=k;c.querySelector('.ic').innerHTML=s.done?CHK:lk?LOCK:s.t=='p'?PLAY:s.t=='b'?STAR:''}
    let pr=c.querySelector('.pr');
    if(run){if(!pr){pr=document.createElement('b');pr.className='pr';c.append(pr)}pr.style.width=(1-(s.until-Date.now())/(s.a*60000))*100+'%'}
    else if(pr)pr.remove();
  });
}
let fresh=-1;
function renderPlan(){
  $('#plist').innerHTML=S.steps.map((s,i)=>`<div class="row${i==fresh?' new':''}"><b>${esc(s.n)}<br><span>${LBL[s.t]} · ${meta(s)}${s.lk&&i?' · gesperrt':''}</span></b>${i?`<button data-up="${i}">↑</button>`:''}<button data-del="${i}">✕</button></div>`).join('')||'<p class="mu">Noch leer.</p>';
  fresh=-1;
}
function renderProf(){
  const n=S.user?S.user.name:'Gast',st=S.steps,d=st.filter(s=>s.done).length,r=st.length-d;
  $('#av').textContent=n[0].toUpperCase();$('#un').textContent=n;$('#bp').textContent=S.lvl;
  $('#lb').style.width=st.length?d/st.length*100+'%':0;
  $('#lv').textContent=st.length&&!r?'Heute geschafft. Mach morgen weiter.':'Noch '+r+(r==1?' Schritt':' Schritte')+' bis zum nächsten Level';
  $('#st1').textContent=S.pts;$('#st2').textContent=S.total;
  $('#out').textContent=S.user&&!S.user.guest?'Abmelden':'Anmelden';
}

function count(el,a,b){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1200);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function burst(p,gold){
  const b=document.createElement('div');b.className='burst'+(gold?' gold':'');
  b.innerHTML='<div class="rg"></div><div class="rg r2"></div><svg class="bc" viewBox="0 0 52 52"><path d="M14 27l8 8 16-17"/></svg><div class="bp">+'+p+'</div><div class="bl">'+(gold?'Belohnung eingelöst':'Disziplin-Punkte')+'</div>'+
    Array.from({length:18},(_,k)=>{const a=k/18*6.283,r=120+Math.random()*90;return `<u style="--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px"></u>`}).join('');
  document.body.append(b);setTimeout(()=>b.remove(),2000);
  count($('#pp'),S.pts-p,S.pts);
}
function levelFx(old,now){
  const up=now>old,dn=now<old,b=document.createElement('div');
  b.className='burst lvl'+(dn?' dnn':'')+(up||dn?'':' hold');
  const seq=up?[old,now]:dn?[now,old]:[now];
  b.innerHTML='<div class="rg"></div><div class="rg r2"></div><div class="lw2"><div>'+seq.map(n=>'<i>'+n+'</i>').join('')+'</div></div><div class="bl">'+(up?'Tag geschafft. Level aufgestiegen.':dn?'Zwei Tage ausgelassen. Level verloren.':'Level gehalten. Du hast einen Tag ausgelassen.')+'</div>'+
    (up?Array.from({length:22},(_,k)=>{const a=k/22*6.283,r=140+Math.random()*100;return `<u style="--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px"></u>`}).join(''):'');
  document.body.append(b);setTimeout(()=>b.remove(),3900);
}
function finish(i){
  const s=S.steps[i];if(s.done)return;
  s.done=1;s.until=0;const p=pts(s);S.pts+=p;S.total++;
  const n=S.steps[i+1];if(n&&n.t=='p'&&!n.done&&!n.until)n.until=Date.now()+n.a*60000; /* Pause startet automatisch */
  let lv=null;
  if(S.steps.every(x=>x.done)&&S.lvlDay!==TK){const miss=S.last?gap(S.last,TK)-1:0,old=S.lvl;S.lvlDay=TK;S.last=TK;S.pl=0;if(miss<1)S.lvl++;lv=[old,S.lvl]}
  save();render();burst(p,s.t=='b');
  if(lv)setTimeout(()=>levelFx(lv[0],lv[1]),2000);
}
$('#list').onclick=e=>{
  const c=e.target.closest('.card');if(!c)return;
  const i=+c.dataset.i,s=S.steps[i];
  if(s.done)return;
  if(isLocked(i)){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');return}
  if(s.t=='p'){if(s.until<Date.now()){s.until=Date.now()+s.a*60000;save();renderHeute()}return}
  finish(i);
};
setInterval(()=>{
  let run=0;
  S.steps.forEach((s,i)=>{if(!s.done&&s.until){if(s.until<=Date.now())finish(i);else run=1}});
  if(run)renderHeute();
},1000);

/* Navigation */
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));
  document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id=='s-'+b.dataset.s));scrollTo(0,0)};
$('#ppill').onclick=()=>document.querySelector('nav [data-s=profil]').click();

/* Plan bearbeiten */
const ed={t:'w',th:0},DEF={w:0,p:2,e:3,b:4};
const pick=(q,el)=>document.querySelectorAll(q+' button').forEach(x=>x.classList.toggle('on',x==el));
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  ed.t=b.dataset.t;ed.th=DEF[ed.t];pick('#seg',b);pick('#sw',$('#sw').children[ed.th]);
  $('#amt').classList.toggle('h',ed.t=='e');
  $('#fa').placeholder={w:'Wiederholungen',p:'Minuten',b:'Bonuspunkte'}[ed.t]||'';
  $('#fa').value={w:30,p:5,b:20}[ed.t]||0;
  $('#fn').placeholder={w:'Name, z. B. 30 Crunches',p:'Name, z. B. Pause',e:'Name, z. B. Proteinshake',b:'Name, z. B. Eine Folge Serie'}[ed.t]};
$('#sw').onclick=e=>{const b=e.target.closest('button');if(!b)return;ed.th=+b.dataset.th;pick('#sw',b)};
$('#add').onclick=()=>{
  S.steps.push({n:$('#fn').value.trim()||LBL[ed.t],t:ed.t,a:ed.t=='e'?0:Math.max(1,+$('#fa').value||1),th:ed.th,lk:$('#fl').checked});
  $('#fn').value='';save();fresh=S.steps.length-1;render()};
$('#plist').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.del!=null){
    const r=b.closest('.row');if(r.classList.contains('out'))return;
    r.style.height=r.offsetHeight+'px';void r.offsetHeight;r.classList.add('out');
    setTimeout(()=>{S.steps.splice(+b.dataset.del,1);save();render()},360);return}
  const i=+b.dataset.up;[S.steps[i-1],S.steps[i]]=[S.steps[i],S.steps[i-1]];fresh=i-1;save();render()};

/* Profil */
$('#reset').onclick=()=>{S.steps.forEach(s=>{s.done=0;s.until=0});save();render()};
$('#out').onclick=async()=>{
  const had=S.user&&S.user.uid;
  try{await authLogout()}catch(e){}
  synced=false;if(had){S=def();roll();sig=''}
  S.user=null;save();render()};

/* Login */
let reg=false;
$('#mode').onclick=()=>{reg=!reg;$('#go').textContent=reg?'Konto erstellen':'Anmelden';$('#mode').textContent=reg?'Schon registriert? Anmelden':'Neu hier? Konto erstellen';$('#msg').textContent=''};
$('#go').onclick=async()=>{
  const e=$('#em').value.trim(),p=$('#pw').value;
  if(!e||!p){$('#msg').textContent='Bitte E-Mail und Passwort eingeben.';return}
  try{S.user=await(reg?authRegister:authLogin)(e,p);save();render()}
  catch(x){$('#msg').textContent=ERR[x.code]||'Anmeldung fehlgeschlagen. Bitte erneut versuchen.'}};
$('#skip').onclick=()=>{S.user={name:'Gast',guest:1};save();render()};

async function pull(uid){
  try{
    const d=await getDoc(doc(db,'users',uid));
    if(d.exists()){const u=S.user;S=Object.assign(def(),d.data(),{user:u});roll();sig=''}
    synced=true;save();render();
  }catch(e){console.error(e)}
}
if(FB_ON)onAuthStateChanged(auth,u=>{
  if(u){S.user={name:u.email,uid:u.uid};pull(u.uid)}
  else if(S.user&&S.user.uid){S.user=null;synced=false;render()}
});
render();
</script>
</body>
</html>
